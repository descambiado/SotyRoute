# GitHub label definitions — apply with:
#   gh label create ... (see scripts/setup-labels.ps1)
# or sync with: https://github.com/nicedoc/action-sync-labels

labels:
  # Type
  - name: "type: bug"
    color: "d73a4a"
    description: "Something is broken"
  - name: "type: feature"
    color: "0075ca"
    description: "New capability or enhancement"
  - name: "type: security"
    color: "e4e669"
    description: "Security hardening or vulnerability"
  - name: "type: docs"
    color: "0075ca"
    description: "Documentation only"
  - name: "type: chore"
    color: "e4e669"
    description: "Build, CI, dependencies"

  # Area
  - name: "area: ui"
    color: "bfd4f2"
    description: "Desktop UI (React/TypeScript)"
  - name: "area: backend"
    color: "bfd4f2"
    description: "Rust backend (Tauri commands, system, evidence)"
  - name: "area: evidence"
    color: "bfd4f2"
    description: "Evidence pipeline (session, exports)"
  - name: "area: profiles"
    color: "bfd4f2"
    description: "Profile schema and validation"
  - name: "area: agent"
    color: "bfd4f2"
    description: "Local agent / Windows Service (v0.2.0+)"

  # Priority
  - name: "priority: critical"
    color: "b60205"
    description: "Blocks a release"
  - name: "priority: high"
    color: "e99695"
    description: "Important, address soon"
  - name: "priority: normal"
    color: "f9d0c4"
    description: "Standard priority"
  - name: "priority: low"
    color: "fef2c0"
    description: "Nice to have"

  # Status
  - name: "status: needs-triage"
    color: "ededed"
    description: "Needs maintainer review"
  - name: "status: in-progress"
    color: "0e8a16"
    description: "Actively being worked on"
  - name: "status: blocked"
    color: "b60205"
    description: "Blocked on something external"
  - name: "status: wontfix"
    color: "ffffff"
    description: "Out of scope or by design"

  # Milestone
  - name: "milestone: v0.1.0"
    color: "c2e0c6"
    description: "Foundation milestone"
  - name: "milestone: v0.2.0"
    color: "c2e0c6"
    description: "Agent milestone"
  - name: "milestone: v0.3.0"
    color: "c2e0c6"
    description: "Tunnels milestone"
  - name: "milestone: v1.0.0"
    color: "0e8a16"
    description: "Stable release milestone"
